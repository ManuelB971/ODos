name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      ops: ${{ steps.filter.outputs.ops }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'odos-back/**'
            frontend:
              - 'odos-front/**'
            infra:
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            ops:
              - 'monitoring/**'
              - 'deploy/**'
              - 'scripts/**'

  backend:
    name: Backend tests (Symfony/PHPUnit)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odos-back
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: odos_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/odos?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend .env for CI
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=0
          DEFAULT_URI=http://localhost
          EOF
      - name: Generate APP_SECRET for CI runtime
        run: echo "APP_SECRET=$(php -r 'echo bin2hex(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Migrate test database
        run: php bin/console doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: composer test

  backend-static-analysis:
    name: Backend static analysis (PHPStan)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odos-back
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/odos?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend .env for CI
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=0
          DEFAULT_URI=http://localhost
          EOF
      - name: Generate APP_SECRET for CI runtime
        run: echo "APP_SECRET=$(php -r 'echo bin2hex(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, pdo_pgsql
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run PHPStan
        run: composer analyse:ci

  backend-coverage:
    name: Backend coverage
    needs: [changes, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odos-back
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: odos_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/odos?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      LLM_ENABLED: "false"
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend .env for CI
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=0
          DEFAULT_URI=http://localhost
          EOF
      - name: Generate APP_SECRET for CI runtime
        run: echo "APP_SECRET=$(php -r 'echo bin2hex(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, pdo_pgsql
          coverage: xdebug
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Migrate test database
        run: php bin/console doctrine:migrations:migrate --no-interaction
      - name: Generate coverage
        run: composer test:coverage
      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: odos-back/var/coverage/html
          if-no-files-found: error

  frontend:
    name: Frontend tests (Expo/Jest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odos-front
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: odos-front/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Knip (unused code report)
        run: pnpm run knip
        continue-on-error: true
      - name: Run tests
        run: pnpm run test:ci

  frontend-coverage:
    name: Frontend coverage
    needs: [changes, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odos-front
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: odos-front/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate coverage
        run: pnpm run test:coverage
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-html
          path: odos-front/coverage
          if-no-files-found: error

  ops-config:
    name: Ops config (monitoring, nginx, scripts)
    needs: changes
    if: needs.changes.outputs.ops == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Shell scripts (bash -n + shellcheck)
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/prod-backup.sh scripts/prod-restore-test.sh

      - name: Monitoring compose file
        working-directory: monitoring
        run: |
          printf 'GRAFANA_ADMIN_USER=ci\nGRAFANA_ADMIN_PASSWORD=ci\nPOSTGRES_EXPORTER_DSN=postgresql://ci:ci@postgres:5432/odos\n' > .env
          mkdir -p secrets
          echo https://discord.invalid/api/webhooks/0/ci > secrets/discord_webhook_url
          echo https://hc-ping.invalid/ci > secrets/watchdog_ping_url
          docker compose config --quiet

      - name: Prometheus config and rules (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Alertmanager config (amtool)
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            -v "$PWD/monitoring/secrets:/run/secrets:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Blackbox modules
        run: |
          docker run --rm -v "$PWD/monitoring/blackbox:/etc/blackbox:ro" \
            prom/blackbox-exporter:v0.27.0 --config.file=/etc/blackbox/blackbox.yml --config.check

      - name: Grafana dashboards are valid JSON
        run: for f in monitoring/grafana/provisioning/dashboards/*.json; do jq -e '.uid and .panels' "$f" > /dev/null; done

      # nginx 1.24 comme sur le VPS (Ubuntu 24.04), avec des certificats jetables
      # aux chemins certbot. Lance ensuite le vrai serveur pour vérifier en-têtes,
      # limitation de débit et logs de métriques lus par nginxlog-exporter.
      - name: Host nginx config (nginx -t + live checks)
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/nginx"
          mkdir -p "$T/conf.d" "$T/snippets" "$T/le" "$T/www/_expo" "$T/logs"
          for d in api.odos-api.com app.odos.world; do
            mkdir -p "$T/le/live/$d"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$d" \
              -keyout "$T/le/live/$d/privkey.pem" -out "$T/le/live/$d/fullchain.pem" 2>/dev/null
          done
          printf 'ssl_session_cache shared:le_nginx_SSL:10m;\nssl_protocols TLSv1.2 TLSv1.3;\n' > "$T/le/options-ssl-nginx.conf"
          openssl dhparam -dsaparam -out "$T/le/ssl-dhparams.pem" 2048 2>/dev/null
          cp deploy/nginx/conf.d/odos-common.conf "$T/conf.d/"
          cp deploy/nginx/api.odos-api.com.conf "$T/conf.d/zz-api.conf"
          cp deploy/nginx/app.odos.world.conf "$T/conf.d/zz-app.conf"
          cp deploy/nginx/snippets/*.conf "$T/snippets/"
          echo '<!doctype html><title>ci</title>' > "$T/www/index.html"
          echo 'console.log(1)' > "$T/www/_expo/app.js"
          echo 'self.onmessage=()=>{}' > "$T/www/maplibre-gl-worker.js"
          run_args=(-v "$T/conf.d:/etc/nginx/conf.d:ro" -v "$T/snippets:/etc/nginx/snippets:ro"
            -v "$T/le:/etc/letsencrypt:ro" -v "$T/www:/var/www/odos-web:ro" -v "$T/logs:/var/log/nginx")
          docker run --rm "${run_args[@]}" nginx:1.24-alpine nginx -t
          docker run -d --name nginx-ci --network host "${run_args[@]}" nginx:1.24-alpine
          docker run -d --name nginxlog-ci -p 127.0.0.1:4040:4040 \
            -v "$PWD/monitoring/nginxlog:/etc/nginxlog:ro" -v "$T/logs:/var/log/nginx:ro" \
            quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0 -config-file=/etc/nginxlog/config.yml
          sleep 3
          web() { curl -sk --resolve app.odos.world:443:127.0.0.1 "$@"; }
          api() { curl -sk --resolve api.odos-api.com:443:127.0.0.1 "$@"; }

          for path in / /map /_expo/app.js /maplibre-gl-worker.js; do
            h="$(web -D - -o /dev/null "https://app.odos.world${path}" | tr -d '\r')"
            # Here-strings plutôt que « echo | grep -q » : avec pipefail, grep -q qui
            # sort à la première ligne fait recevoir SIGPIPE à echo (code 141).
            grep -qi '^strict-transport-security: max-age=31536000' <<<"$h" || { echo "HSTS manquant sur ${path}"; exit 1; }
            grep -qi "^content-security-policy: default-src 'self'" <<<"$h" || { echo "CSP manquante sur ${path}"; exit 1; }
            grep -qi '^server: nginx$' <<<"$h" || { echo "Version nginx exposée sur ${path}"; exit 1; }
          done
          h="$(web -D - -o /dev/null https://app.odos.world/_expo/app.js)"
          grep -qi '^cache-control: public, immutable' <<<"$h" || { echo "Cache-Control immutable absent sur /_expo/"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' --resolve app.odos.world:80:127.0.0.1 http://app.odos.world/map)"
          [ "$code" = "301" ] || { echo "Port 80 : HTTP $code au lieu de 301"; exit 1; }
          h="$(api -D - -o /dev/null https://api.odos-api.com/api/health)"
          grep -qi '^strict-transport-security' <<<"$h" || { echo "HSTS manquant sur l'API"; exit 1; }

          # Pas d'API derrière : 502 tant que la rafale tient, puis 429.
          codes="$(for i in $(seq 1 30); do api -o /dev/null -w '%{http_code}\n' -X POST https://api.odos-api.com/api/token/refresh; done | sort | uniq -c)"
          echo "$codes"
          grep -q ' 429$' <<<"$codes" || { echo "limit_req inactif sur /api/token/refresh"; exit 1; }
          get_codes="$(for i in $(seq 1 30); do api -o /dev/null -w '%{http_code}\n' https://api.odos-api.com/api/users/1/profile; done | sort -u)"
          [ "$get_codes" = "502" ] || { echo "GET limités à tort : $get_codes"; exit 1; }

          sleep 2
          metrics="$(curl -fsS http://127.0.0.1:4040/metrics)"
          grep -E '^nginx_http_response_count_total\{.*vhost="(api|web)"' <<<"$metrics"
          grep -qE '^nginx_http_response_count_total\{.*status="429".*vhost="api"' <<<"$metrics" \
            || { echo "nginxlog-exporter ne voit pas les 429 de l'API"; exit 1; }
          grep -qE '^nginx_http_response_time_seconds_hist_bucket\{.*vhost="web"' <<<"$metrics" \
            || { echo "Histogramme de latence absent. Métriques exposées :"; grep -oE '^nginx_[a-z_]+' <<<"$metrics" | sort -u; exit 1; }
          ! grep -E '([0-9]{1,3}\.){3}[0-9]{1,3}' "$T"/logs/odos-metrics-*.log || { echo "IP dans les logs de métriques"; exit 1; }

      - name: nginx logs on failure
        if: failure()
        run: docker logs nginx-ci 2>&1 | tail -n 30; docker logs nginxlog-ci 2>&1 | tail -n 30

  docker-backend-prod:
    name: Build backend prod image
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image (prod target)
        run: docker build --target prod -t odos-back:ci ./odos-back
