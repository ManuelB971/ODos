global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]

  - job_name: redis
    static_configs:
      - targets: ["127.0.0.1:9121"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: nginxlog
    static_configs:
      - targets: ["127.0.0.1:4040"]

  # CrowdSec installé sur l'hôte (métriques sur 127.0.0.1:6060 par défaut).
  - job_name: crowdsec
    static_configs:
      - targets: ["127.0.0.1:6060"]

  # Disponibilité vue de l'extérieur du conteneur + expiration TLS.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://api.odos-api.com/api/categories
          - https://app.odos.world/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Santé applicative : la base et Redis vus par Symfony.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [https_health]
    static_configs:
      - targets:
          - https://api.odos-api.com/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
