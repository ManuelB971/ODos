# Nginx hôte — web app ODOS (export statique Expo dans /var/www/odos-web).
# Configuration complète, HTTPS compris : le bloc 443 n'est plus écrit par certbot,
# il est versionné ici pour que le repo ne dérive plus de la prod.
#
# Dépend de :
#   /etc/nginx/conf.d/odos-common.conf                  (deploy/nginx/conf.d/)   server_tokens, log_format
#   /etc/nginx/snippets/odos-security-headers-web.conf  (deploy/nginx/snippets/) HSTS, CSP…
#   /etc/letsencrypt/...                                certificat certbot existant (sudo certbot certificates)
#   DNS app.odos.world → VPS ; build publié par deploy-prod.yml (docs/WEB_APP_DEPLOYMENT.md)
#
# Install / mise à jour : docs/ops/RUNBOOK_NGINX.md
#   sudo cp ~/ODos/deploy/nginx/app.odos.world.conf /etc/nginx/sites-available/app.odos.world
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.odos.world;

    # Challenge Let's Encrypt (renouvellement en webroot ou via le plugin nginx).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.odos.world;

    ssl_certificate /etc/letsencrypt/live/app.odos.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.odos.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log;
    # Métriques 5xx / latence (log_format odos_metrics, sans IP).
    access_log /var/log/nginx/odos-metrics-web.log odos_metrics;

    root /var/www/odos-web;
    index index.html;

    include snippets/odos-security-headers-web.conf;

    # Assets hashés (immutables) → cache long. Les en-têtes de sécurité sont
    # ré-inclus : un add_header dans la location annule ceux du server.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/odos-security-headers-web.conf;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/odos-security-headers-web.conf;
        try_files $uri =404;
    }

    # index.html change à chaque déploiement : toujours revalider (aussi
    # atteint par le fallback SPA ci-dessous, via redirection interne).
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/odos-security-headers-web.conf;
    }

    # Fallback SPA : toute route inconnue (expo-router) sert index.html.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
