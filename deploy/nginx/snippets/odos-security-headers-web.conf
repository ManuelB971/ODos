# En-têtes de sécurité de app.odos.world. À inclure dans le server ET dans
# chaque location qui fait son propre add_header : nginx n'hérite les
# add_header du server que si la location n'en déclare aucun.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
# CSP de l'export Expo web, vérifiée sur la carte (maplibre v6, OpenFreeMap) :
#   script-src 'self'          un seul bundle /_expo/static/js/*, aucun script inline
#   style-src 'unsafe-inline'  react-native-web injecte ses styles (<style> et attributs style)
#   worker-src 'self' blob:    /maplibre-gl-worker.js (worker module), blob: en repli
#   connect-src                API ; OpenFreeMap (style, tuiles, sprites, glyphes) ; style de
#                              secours demotiles ; endpoints OAuth Google (connexion Google web)
#   img-src https:             photos d'activités importées hébergées hors de l'API
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.odos-api.com https://tiles.openfreemap.org https://demotiles.maplibre.org https://oauth2.googleapis.com https://openidconnect.googleapis.com https://www.googleapis.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
