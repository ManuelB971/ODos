# Nginx hôte — API ODOS (Symfony dans Docker, nginx conteneur sur 127.0.0.1:8000).
# Configuration complète, HTTPS compris : le bloc 443 n'est plus écrit par certbot,
# il est versionné ici pour que le repo ne dérive plus de la prod.
#
# Dépend de :
#   /etc/nginx/conf.d/odos-common.conf       (deploy/nginx/conf.d/)   server_tokens, log_format, zones limit_req
#   /etc/nginx/snippets/odos-proxy-api.conf  (deploy/nginx/snippets/)
#   /etc/letsencrypt/...                     certificat certbot existant (sudo certbot certificates)
#
# Install / mise à jour : docs/ops/RUNBOOK_NGINX.md
#   sudo cp ~/ODos/deploy/nginx/api.odos-api.com.conf /etc/nginx/sites-available/api.odos-api.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.odos-api.com;

    # Challenge Let's Encrypt (renouvellement en webroot ou via le plugin nginx).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.odos-api.com;

    ssl_certificate /etc/letsencrypt/live/api.odos-api.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.odos-api.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log;
    # Métriques 5xx / latence (log_format odos_metrics, sans IP).
    access_log /var/log/nginx/odos-metrics-api.log odos_metrics;

    client_max_body_size 20M;

    # Hérités par toutes les locations : aucune ne redéfinit add_header ni proxy_set_header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Pas de CSP complète (EasyAdmin et /api/docs ont des scripts inline) :
    # on interdit seulement l'intégration en iframe.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Masque « X-Powered-By: PHP/8.x » renvoyé par PHP-FPM.
    proxy_hide_header X-Powered-By;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Connexion JSON (security.yaml, firewall login), refresh du token
    # (routes.yaml, Gesdinet), Google / Apple (SocialAuthController).
    location ~ ^/api/(login|token/refresh|auth/google|auth/apple)$ {
        limit_req zone=odos_auth burst=20 nodelay;
        include snippets/odos-proxy-api.conf;
    }
    # Formulaire de connexion EasyAdmin (SecurityController, firewall main).
    location = /login {
        limit_req zone=odos_auth burst=20 nodelay;
        include snippets/odos-proxy-api.conf;
    }

    # Mot de passe oublié : /request et /confirm (PasswordResetController).
    location ^~ /api/auth/password-reset/ {
        limit_req zone=odos_signup burst=10 nodelay;
        include snippets/odos-proxy-api.conf;
    }
    # Inscription : POST /api/users (API Platform, User::Post). Les GET
    # /api/users/{id}/... ne passent pas ici et la clé n'est posée que sur POST.
    location = /api/users {
        limit_req zone=odos_signup burst=10 nodelay;
        include snippets/odos-proxy-api.conf;
    }

    location / {
        include snippets/odos-proxy-api.conf;
    }
}
