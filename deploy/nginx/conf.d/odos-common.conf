# Réglages communs aux vhosts ODOS (contexte http du nginx hôte).
# Install : sudo cp ~/ODos/deploy/nginx/conf.d/odos-common.conf /etc/nginx/conf.d/
# (nginx.conf d'Ubuntu inclut déjà /etc/nginx/conf.d/*.conf dans http {}).
# Procédure complète : docs/ops/RUNBOOK_NGINX.md

# Pas de version de nginx dans l'en-tête Server ni dans les pages d'erreur.
server_tokens off;

# Log réservé aux métriques (prometheus-nginxlog-exporter, monitoring/nginxlog/).
# Volontairement sans IP ni query string ($uri au lieu de $request) : pas de
# donnée personnelle ni de jeton d'URL, conservation courte possible.
log_format odos_metrics '"$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$upstream_response_time"';

# ── Limitation de débit des routes sensibles de l'API (par IP) ──
# Première barrière avant PHP : Symfony applique ensuite ses propres limites
# (odos-back/config/packages/rate_limiter.yaml). Seuils larges, car une classe
# ou une entreprise peut partager une seule IP publique (NAT).
#   odos_auth   : connexion, refresh du token, Google / Apple, /login admin
#   odos_signup : inscription, mot de passe oublié (envoient des e-mails)
# Seules les requêtes POST comptent (clé vide = non limitée).
map $request_method $odos_ratelimit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $odos_ratelimit_key zone=odos_auth:10m rate=20r/m;
limit_req_zone $odos_ratelimit_key zone=odos_signup:10m rate=6r/m;
limit_req_status 429;
limit_req_log_level warn;
