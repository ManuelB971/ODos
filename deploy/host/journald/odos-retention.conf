# /etc/systemd/journald.conf.d/odos-retention.conf
# Le journal systemd contient des IP (sshd, ufw, crowdsec). Rétention alignée
# sur la recommandation CNIL relative à la journalisation (6 mois à 1 an) :
# on garde 6 mois, plafonné en taille pour ne pas remplir le disque.
# Procédure : docs/ops/RUNBOOK_DURCISSEMENT_HOTE.md § 6
[Journal]
MaxRetentionSec=6month
SystemMaxUse=1G
