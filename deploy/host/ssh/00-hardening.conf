# /etc/ssh/sshd_config.d/00-hardening.conf — durcissement SSH du VPS ODOS.
# Préfixe 00 : sshd garde la PREMIÈRE valeur lue, ce fichier l'emporte donc sur
# 50-cloud-init.conf (qui remet PasswordAuthentication yes sur les images cloud).
# Procédure (session de secours ouverte, test avant fermeture) :
#   docs/ops/RUNBOOK_DURCISSEMENT_HOTE.md § 1

# Clé uniquement.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Pas de root, deux comptes seulement : odos (admin) et deploy (GitHub Actions).
PermitRootLogin no
AllowUsers odos deploy

MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowAgentForwarding no
# « local » garde les tunnels -L vers Grafana / Prometheus (127.0.0.1).
AllowTcpForwarding local
PermitTunnel no

# La CI n'a besoin ni de tunnel ni de redirection.
Match User deploy
    AllowTcpForwarding no
